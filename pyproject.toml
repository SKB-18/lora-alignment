[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-alignment"
version = "0.1.0"
description = "Production PEFT and Preference Alignment Engine: LoRA, QLoRA NF4 Double Quantization, and DPO"
readme = "README.md"
authors = [{ name = "SKB-18" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
lora-align = "cli:main"
